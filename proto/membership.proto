syntax = "proto3";

package membership;

option go_package = "club-membership-system/proto;pb";

import "proto/club.proto";

service MembershipService {
  rpc CreateMembership(CreateMembershipRequest) returns (Membership);
  rpc GetMembership(GetMembershipRequest) returns (Membership);
  rpc ListMemberships(ListMembershipsRequest)
      returns (ListMembershipsResponse);
  rpc UpdateMembership(UpdateMembershipRequest) returns (Membership);
  rpc DeleteMembership(DeleteMembershipRequest)
      returns (DeleteMembershipResponse);
}

message Membership {
  int64 id = 1;
  string student_name = 2;
  string student_id = 3;
  int64 club_id = 4;
  club.Club club = 5;
}

message CreateMembershipRequest {
  string student_name = 1;
  string student_id = 2;
  int64 club_id = 3;
}

message GetMembershipRequest {
  int64 id = 1;
}

message ListMembershipsRequest {}

message ListMembershipsResponse {
  repeated Membership memberships = 1;
}

message UpdateMembershipRequest {
  int64 id = 1;
  string student_name = 2;
  string student_id = 3;
  int64 club_id = 4;
}

message DeleteMembershipRequest {
  int64 id = 1;
}

message DeleteMembershipResponse {
  string message = 1;
}